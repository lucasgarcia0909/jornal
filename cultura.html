<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joaquim News</title>
    <link rel="stylesheet" href="estilos/estilo002.css">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">    
</head>
<body>
    <header>
        <h1>Cultura</h1>
        <div class="logo">
        <picture>
            <source media="(max-width: 150px)" srcset="imagens/logo70.png">
            <img src="imagens/logo.png" alt="Logo joaquim news">
        </picture>
    </div>
    </header>
    <nav>
      <p><a href="index.html">Home</a>
         / 
         <a href="esportes.html">Esportes</a>
         /
        <a href="cultura.html">Cultura</a>
        /
        <a href="eventos.html">Eventos</a>
        /
        <a href="escola.html">Escola</a>
        /
        <a href="sobrenos.html">Sobre nós</a>
    </p>
    </nav>
    <main>
        <article id="sem-noticias">
            <p class="aviso">Ainda não existe nenhuma matéria sobre Cultura <br> :(</p>
        </article>
    </main>

    <script>
    (function() {
        var FIREBASE_URL = 'https://joaquim-news-default-rtdb.firebaseio.com/noticias';
        var CATEGORIA    = 'cultura';

        fetch(FIREBASE_URL + '.json')
            .then(function(r) { return r.json(); })
            .then(function(dados) {
                if (!dados) return;

                var entradas = Object.entries(dados)
                    .filter(function(e) { return e[1].categoria === CATEGORIA; })
                    .sort(function(a, b) { return b[0].localeCompare(a[0]); });

                if (entradas.length === 0) return;

                document.getElementById('sem-noticias').style.display = 'none';
                var main = document.querySelector('main');

                entradas.forEach(function(entrada) {
                    var chave   = entrada[0];
                    var noticia = entrada[1];
                    var href    = 'noticia.html?id=' + chave;
                    var img     = noticia.capa
                        ? '<img src="' + noticia.capa + '" alt="Capa" style="max-width:100%;height:auto;">'
                        : '';

                    var art = document.createElement('article');
                    art.className = 'noti';
                    art.innerHTML =
                        '<div class="notirig">' +
                            '<p style="font-weight:700;"><a href="' + href + '">' + noticia.titulo + '</a></p>' +
                            '<a href="' + href + '">' + img + '</a>' +
                        '</div>';
                    main.appendChild(art);
                });
            })
            .catch(function() {});
    })();
    </script>
</body>
</html>
